[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "korean-career-discovery-mcp"
version = "0.3.0"
description = "Dialogue-guided Korean career discovery and job monitoring MCP"
requires-python = ">=3.11"
dependencies = ["certifi>=2024.7.4", "filelock>=3.16,<4", "tzdata>=2024.1"]

[project.optional-dependencies]
mcp = ["mcp>=1.26,<2"]
documents = ["pypdf>=5,<7", "Pillow>=11,<13", "pytesseract>=0.3.13,<0.4"]

[project.scripts]
jobmonitor = "jobmonitor.cli:main"
career-discovery-mcp = "jobmonitor.mcp_server:main"

[tool.setuptools.packages.find]
include = ["jobmonitor*"]
